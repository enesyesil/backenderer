name: Deploy App
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, prod]
        default: dev
      config_file:
        type: string
        default: "examples/single-app.yaml"
      tf_version:
        type: string
        default: "1.6.6"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read deploy config
        id: cfg
        run: |
          python3 -m pip install --user yq >/dev/null 2>&1 || true
          PATH="$HOME/.local/bin:$PATH"
          echo "name=$(yq -r '.name // empty' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT
          echo "server_name=$(yq -r '.server_name // empty' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT
          echo "container_port=$(yq -r '.container_port // 8080' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT
          echo "image_uri=$(yq -r '.image_uri // empty' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT
          echo "mode=$(yq -r '.mode // \"source\"' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT
          echo "registry=$(yq -r '.registry // \"ecr\"' ${{ inputs.config_file }})" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.tf_version }}

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch Terraform outputs (instance & ECR)
        id: tfout
        run: |
          cd infra/terraform/envs/${{ inputs.env }}
          terraform init -upgrade
          terraform output -json > /tmp/outs.json
          echo "instance_id=$(jq -r '.instance_id.value // empty' /tmp/outs.json)" >> $GITHUB_OUTPUT
          echo "public_ip=$(jq -r '.public_ip.value // empty' /tmp/outs.json)" >> $GITHUB_OUTPUT
          echo "ecr_repo_url=$(jq -r '.ecr_repo_url.value // empty' /tmp/outs.json)" >> $GITHUB_OUTPUT

      - name: Build & push image (source mode)
        if: steps.cfg.outputs.mode == 'source'
        run: |
          ECR="${{ steps.tfout.outputs.ecr_repo_url }}"
          APP="${{ steps.cfg.outputs.name }}"
          [[ -n "$ECR" && -n "$APP" ]] || { echo "Missing ECR or app name"; exit 1; }
          aws ecr get-login-password | docker login --username AWS --password-stdin "$(echo "$ECR" | cut -d/ -f1)"
          docker build -t "$ECR:$APP" ./app
          docker push "$ECR:$APP"
          echo "image=$ECR:$APP" >> $GITHUB_OUTPUT

      - name: Use provided image (image mode)
        if: steps.cfg.outputs.mode == 'image'
        run: echo "image=${{ steps.cfg.outputs.image_uri }}" >> $GITHUB_OUTPUT

      - name: Register app on instance via SSM
        run: |
          IID="${{ steps.tfout.outputs.instance_id }}"
          NAME="${{ steps.cfg.outputs.name }}"
          PORT="${{ steps.cfg.outputs.container_port }}"
          HOST="${{ steps.cfg.outputs.server_name }}"
          IMG="$(grep -m1 '^image=' $GITHUB_OUTPUT | cut -d= -f2)"
          [[ -n "$IID" && -n "$NAME" && -n "$PORT" && -n "$HOST" && -n "$IMG" ]] || { echo "Missing inputs for registration"; exit 1; }
          aws ssm send-command \
            --targets "Key=instanceIds,Values=$IID" \
            --document-name "AWS-RunShellScript" \
            --comment "Backenderer register" \
            --parameters "commands=[\"/usr/bin/bash /opt/backenderer/register.sh ${NAME} ${IMG} ${PORT} ${HOST}\"]" \
            --output text
