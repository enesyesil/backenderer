name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        type: choice
        default: dev
        options: [dev, prod]

concurrency:
  group: backenderer-${{ github.event.inputs.env || 'deploy' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load .env if present
        run: |
          if [ -f ".env" ]; then
            grep -Ev '^\s*(#|$)' .env >> "$GITHUB_ENV"
          fi

      - name: Validate deploy config
        run: ./scripts/validate_config.sh backenderer.config.yaml

      - name: Export deploy config
        id: cfg
        run: |
          ./scripts/read_config_json.sh backenderer.config.yaml \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

      - name: Select environment settings
        id: sel
        env:
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN_PROD }}
          AWS_REGION_DEV: ${{ vars.AWS_REGION_DEV }}
          AWS_REGION_PROD: ${{ vars.AWS_REGION_PROD }}
        run: ./scripts/select_env.sh deploy "${{ github.event.inputs.env }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.sel.outputs.role_arn }}
          aws-region: ${{ steps.sel.outputs.aws_region }}

      - name: Resolve target instance
        id: target
        env:
          TARGET_ENV: ${{ steps.sel.outputs.env }}
        run: |
          set -euo pipefail

          INSTANCE_IDS="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Backenderer,Values=$TARGET_ENV" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" = "None" ]; then
            echo "No running Backenderer instance found for environment $TARGET_ENV" >&2
            exit 1
          fi

          set -- $INSTANCE_IDS
          if [ "$#" -ne 1 ]; then
            echo "Expected exactly one running Backenderer instance for $TARGET_ENV, found $# ($INSTANCE_IDS)" >&2
            exit 1
          fi

          echo "instance_id=$1" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        if: ${{ steps.cfg.outputs.mode == 'source' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build or select image
        id: image
        env:
          MODE: ${{ steps.cfg.outputs.mode }}
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
          IMAGE_URI_FROM_CONFIG: ${{ steps.cfg.outputs.image_uri }}
          ECR_REPO_NAME: ${{ steps.sel.outputs.ecr_repo_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "source" ]; then
            SHORT_SHA="${GITHUB_SHA::12}"
            TAG="${APP_NAME}-${SHORT_SHA}"
            REPOSITORY_URI="$(aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --query 'repositories[0].repositoryUri' --output text)"
            test -n "$REPOSITORY_URI" || { echo "ECR repository $ECR_REPO_NAME not found" >&2; exit 1; }
            IMAGE_URI="${REPOSITORY_URI}:${TAG}"
            docker build -f app/Dockerfile -t "$IMAGE_URI" ./app
            docker push "$IMAGE_URI"
          else
            IMAGE_URI="$IMAGE_URI_FROM_CONFIG"
          fi

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register on EC2 via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          APP_NAME: ${{ steps.cfg.outputs.app_name }}
          IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}
          APP_PORT: ${{ steps.cfg.outputs.app_port }}
          SERVER_NAME: ${{ steps.cfg.outputs.server_name }}
          HEALTH_PATH: ${{ steps.cfg.outputs.health_path }}
          TARGET_ENV: ${{ steps.sel.outputs.env }}
        run: |
          set -euo pipefail

          printf -v REMOTE_CMD '%q %q %q %q %q %q' \
            /opt/backenderer/register.sh \
            "$APP_NAME" \
            "$IMAGE_URI" \
            "$APP_PORT" \
            "$SERVER_NAME" \
            "$HEALTH_PATH"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "Backenderer deploy ${APP_NAME} (${TARGET_ENV})" \
            --parameters "$(jq -n --arg cmd "$REMOTE_CMD" '{commands: [$cmd]}')" \
            --query 'Command.CommandId' \
            --output text)"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.COMMAND_ID }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail

          ATTEMPT=0
          START_TS="$(date +%s)"
          STATUS=""

          while :; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed|"")
                ATTEMPT=$((ATTEMPT + 1))
                ELAPSED=$(( $(date +%s) - START_TS ))
                if [ "$ATTEMPT" -ge 720 ]; then
                  echo "Timed out waiting for SSM command $COMMAND_ID after ${ELAPSED}s" >&2
                  exit 1
                fi
                echo "Waiting for SSM command $COMMAND_ID: status=$STATUS elapsed_seconds=${ELAPSED}" >&2
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: $STATUS" >&2
                exit 1
                ;;
            esac
          done

          STDOUT="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text)"

          STDERR="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text)"

          {
            echo "## Deploy command output"
            echo
            echo "- Status: $STATUS"
            echo "- Command ID: $COMMAND_ID"
            echo "- Elapsed seconds: $(( $(date +%s) - START_TS ))"
            echo
            echo "### stdout"
            echo '```'
            echo "$STDOUT"
            echo '```'
            echo
            echo "### stderr"
            echo '```'
            echo "$STDERR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status $STATUS" >&2
            exit 1
          fi
