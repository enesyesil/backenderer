name: Remove Stack

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, prod]
      confirm_env:
        description: Type the environment name again to confirm destroy
        required: true
        type: string

concurrency:
  group: backenderer-${{ github.event.inputs.env || 'remove' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.8.5"

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load .env if present
        run: |
          if [ -f ".env" ]; then
            grep -Ev '^\s*(#|$)' .env >> "$GITHUB_ENV"
          fi

      - name: Confirm destroy target
        run: |
          if [ "${{ github.event.inputs.env }}" != "${{ github.event.inputs.confirm_env }}" ]; then
            echo "confirm_env must exactly match env" >&2
            exit 1
          fi

      - name: Validate deploy config
        run: ./scripts/validate_config.sh backenderer.config.yaml

      - name: Export deploy config
        id: cfg
        run: |
          ./scripts/read_config_json.sh backenderer.config.yaml \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

      - name: Select environment settings
        id: sel
        env:
          AWS_ROLE_ARN_DEV: ${{ secrets.AWS_ROLE_ARN_DEV }}
          AWS_ROLE_ARN_PROD: ${{ secrets.AWS_ROLE_ARN_PROD }}
          AWS_REGION_DEV: ${{ vars.AWS_REGION_DEV }}
          AWS_REGION_PROD: ${{ vars.AWS_REGION_PROD }}
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
          DEV_AMI_ID: ${{ vars.DEV_AMI_ID }}
          DEV_INSTANCE_TYPE: ${{ vars.DEV_INSTANCE_TYPE }}
          DEV_NAME_PREFIX: ${{ vars.DEV_NAME_PREFIX }}
          DEV_TLS_MODE: ${{ vars.DEV_TLS_MODE }}
          DEV_ROUTE53_ZONE_ID: ${{ vars.DEV_ROUTE53_ZONE_ID }}
          DEV_INSTANCE_PROFILE: ${{ vars.DEV_INSTANCE_PROFILE }}
          PROD_AMI_ID: ${{ vars.PROD_AMI_ID }}
          PROD_INSTANCE_TYPE: ${{ vars.PROD_INSTANCE_TYPE }}
          PROD_NAME_PREFIX: ${{ vars.PROD_NAME_PREFIX }}
          PROD_TLS_MODE: ${{ vars.PROD_TLS_MODE }}
          PROD_ROUTE53_ZONE_ID: ${{ vars.PROD_ROUTE53_ZONE_ID }}
          PROD_INSTANCE_PROFILE: ${{ vars.PROD_INSTANCE_PROFILE }}
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          TFSTATE_REGION: ${{ vars.TFSTATE_REGION }}
        run: ./scripts/select_env.sh remove "${{ github.event.inputs.env }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.sel.outputs.role_arn }}
          aws-region: ${{ steps.sel.outputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Render CI Terraform variables
        working-directory: ${{ steps.sel.outputs.tf_dir }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          ENVIRONMENT: ${{ steps.sel.outputs.env }}
          OIDC_PROVIDER_ARN: ${{ steps.sel.outputs.github_oidc_provider_arn }}
          STATE_BUCKET_NAME: ${{ steps.sel.outputs.tfstate_bucket }}
          AWS_REGION: ${{ steps.sel.outputs.aws_region }}
          AMI_ID: ${{ steps.sel.outputs.ami_id }}
          HEALTH_PATH: ${{ steps.cfg.outputs.health_path }}
          INSTANCE_TYPE: ${{ steps.sel.outputs.instance_type }}
          NAME_PREFIX: ${{ steps.sel.outputs.name_prefix }}
          TLS_MODE: ${{ steps.sel.outputs.tls_mode }}
          ROUTE53_ZONE_ID: ${{ steps.sel.outputs.route53_zone_id }}
          INSTANCE_PROFILE: ${{ steps.sel.outputs.instance_profile }}
          SERVER_NAME: ${{ steps.cfg.outputs.server_name }}
        run: ../../../../scripts/render_ci_tfvars.sh ci.auto.tfvars.json

      - name: Terraform init
        working-directory: ${{ steps.sel.outputs.tf_dir }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ steps.sel.outputs.tfstate_bucket }}" \
            -backend-config="key=envs/${{ steps.sel.outputs.env }}/terraform.tfstate" \
            -backend-config="region=${{ steps.sel.outputs.tfstate_region }}"

      - name: Terraform destroy
        working-directory: ${{ steps.sel.outputs.tf_dir }}
        run: terraform destroy -auto-approve -var-file=ci.auto.tfvars.json
