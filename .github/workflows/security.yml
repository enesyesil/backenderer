name: Security

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "backenderer.config.yaml"
      - ".env.example"
  workflow_dispatch:

permissions: {}

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          hide-progress: true
          format: table
          exit-code: "1"

  terraform-config:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy config scan
        id: trivy_config
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          output: trivy-config.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Publish Trivy config results
        if: always()
        run: |
          if [ -s trivy-config.txt ]; then
            {
              echo "## Terraform security scan"
              echo
              echo "<details><summary>Show Trivy findings</summary>"
              echo
              echo '```text'
              cat trivy-config.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Terraform security scan"
              echo
              echo "Trivy did not produce any table output."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
