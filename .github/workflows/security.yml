name: Security

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "backenderer.config.yaml"
      - ".env.example"
  workflow_dispatch:

permissions: {}

env:
  TRIVY_IMAGE: "aquasec/trivy:0.69.3"

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trivy secret scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${TRIVY_IMAGE}" \
            fs \
            --scanners secret \
            --no-progress \
            --exit-code 1 \
            .

  terraform-config:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Trivy config scan
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${TRIVY_IMAGE}" \
            config \
            --severity HIGH,CRITICAL \
            --format table \
            --output /work/trivy-config.txt \
            --exit-code 0 \
            --no-progress \
            .

      - name: Publish Trivy config results
        if: always()
        run: |
          if [ -s trivy-config.txt ]; then
            {
              echo "## Terraform security scan"
              echo
              echo "<details><summary>Show Trivy findings</summary>"
              echo
              echo '```text'
              cat trivy-config.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Terraform security scan"
              echo
              echo "Trivy did not produce any table output."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
