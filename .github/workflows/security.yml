name: Security

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/**"
      - "infra/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - "backenderer.config.yaml"
      - ".env.example"
  workflow_dispatch:

permissions: {}

env:
  TRIVY_VERSION: "v0.65.0"

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Trivy CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/trivy-bin" "$TRIVY_VERSION"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Trivy secret scan
        run: |
          trivy fs \
            --scanners secret \
            --no-progress \
            --exit-code 1 \
            .

  terraform-config:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Trivy CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/trivy-bin" "$TRIVY_VERSION"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Trivy config scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-config.txt \
            --exit-code 0 \
            --no-progress \
            .

      - name: Publish Trivy config results
        if: always()
        run: |
          if [ -s trivy-config.txt ]; then
            {
              echo "## Terraform security scan"
              echo
              echo "<details><summary>Show Trivy findings</summary>"
              echo
              echo '```text'
              cat trivy-config.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Terraform security scan"
              echo
              echo "Trivy did not produce any table output."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
